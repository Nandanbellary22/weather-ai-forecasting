
name: Supabase Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check psycopg2-binary

      - name: Test Supabase database connection
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2

          required = [
              "SUPABASE_DB_HOST",
              "SUPABASE_DB_USER",
              "SUPABASE_DB_PASSWORD",
          ]

          missing = [
              name for name in required
              if not os.getenv(name)
          ]

          if missing:
              print(
                  "Missing required GitHub secrets: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          connection = None

          try:
              connection = psycopg2.connect(
                  host=os.environ["SUPABASE_DB_HOST"],
                  port=5432,
                  dbname="postgres",
                  user=os.environ["SUPABASE_DB_USER"],
                  password=os.environ["SUPABASE_DB_PASSWORD"],
                  sslmode="require",
                  connect_timeout=15,
              )

              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT current_database(), current_user"
                  )
                  database, user = cursor.fetchone()

                  cursor.execute("""
                      SELECT EXISTS (
                          SELECT 1
                          FROM information_schema.tables
                          WHERE table_schema = 'public'
                            AND table_name =
                                'temperature_forecast_snapshots'
                      )
                  """)
                  table_exists = cursor.fetchone()[0]

              print("Database connection successful.")
              print(f"Database: {database}")
              print(f"Connected user: {user}")
              print(f"Forecast table exists: {table_exists}")

              if not table_exists:
                  sys.exit("Forecast table was not found.")

          except Exception as exc:
              print(
                  f"Connection test failed: "
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)

          finally:
              if connection is not None:
                  connection.close()
          PY
