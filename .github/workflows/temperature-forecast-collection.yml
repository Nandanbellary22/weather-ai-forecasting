
name: Hourly Temperature Forecast Collection

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temperature-forecast-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Collect forecasts for 500 locations
        run: python -u -m data_pipeline.crawlers.weather.collect_temperature_forecasts

      - name: Validate latest snapshot
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          output_dir = Path("data/processed/temperature_forecast_snapshots")
          snapshots = sorted(
              output_dir.glob("temperature_forecast_*.csv"),
              key=lambda path: path.stat().st_mtime,
              reverse=True,
          )

          if not snapshots:
              raise SystemExit("No forecast snapshot was created.")

          snapshot = snapshots[0]
          with snapshot.open("r", newline="", encoding="utf-8-sig") as file:
              reader = csv.DictReader(file)
              rows = list(reader)

          expected_columns = {
              "collection_time_utc",
              "target_time_local",
              "timezone",
              "source",
              "location_id",
              "location_name",
              "requested_latitude",
              "requested_longitude",
              "returned_latitude",
              "returned_longitude",
              "forecast_temperature_c",
          }

          if not expected_columns.issubset(reader.fieldnames or []):
              raise SystemExit("Snapshot is missing required columns.")

          if len(rows) != 24000:
              raise SystemExit(
                  f"Expected 24000 rows, found {len(rows)} in {snapshot.name}"
              )

          locations = {row["location_id"] for row in rows}
          pairs = {
              (row["location_id"], row["target_time_local"])
              for row in rows
          }

          if len(locations) != 500:
              raise SystemExit(f"Expected 500 locations, found {len(locations)}.")

          if len(pairs) != 24000:
              raise SystemExit("Duplicate location/target-time pairs detected.")

          print(f"Validated snapshot: {snapshot}")
          print(f"Rows: {len(rows)}")
          print(f"Locations: {len(locations)}")
          PY

      - name: Upload forecast snapshot
        uses: actions/upload-artifact@v4
        with:
          name: temperature-forecast-${{ github.run_id }}
          path: data/processed/temperature_forecast_snapshots/temperature_forecast_*.csv
          if-no-files-found: error
          retention-days: 30
