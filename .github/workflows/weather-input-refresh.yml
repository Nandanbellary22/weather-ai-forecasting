name: Hourly Weather Model Input Refresh

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-input-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${{ secrets.SUPABASE_DB_USER }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "20"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests psycopg2-binary
      - name: Refresh multivariable weather inputs
        run: python -u -m data_pipeline.crawlers.weather.refresh_weather_inputs
