      operationId: rasterData
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        explode: false
        schema:
          type: string
          description: Raster format
          nullable: true
          enum:
          - geotiff
          - kmz
          - png
      responses:
        "200":
          description: rasterData 200 response
          content:
            application/vnd.google-earth.kmz:
              schema:
                type: string
                format: binary
            image/geotiff:
              schema:
                type: string
                format: binary
