  /api/v1/time-series/telemetry/recent/inventory:
    get:
      tags:
      - Time-series
      summary: Retrieves the recent time series inventory.
      description: Retrieves the recent time series inventory. This function fetches
        the most recent time series inventory data from the cache service. It provides
        a list of available time series data that can be used for further analysis
        or display.
      operationId: recentTimeSeriesInventory
      responses:
        "200":
          description: "A \\[List\\] of \\[TimeSeriesDto\\] objects representing the\
            \ recent time series inventory. Each \\[TimeSeriesDto\\] in the list contains\
            \ information about a specific time series, such as its identifier, name,\
            \ and other relevant metadata."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSeriesDto"
  /api/v1/time-series/telemetry/recent/measurement:
    get:
      tags:
      - Time-series
      summary: Retrieves recent measurements for specified time series identifiers.
      description: Retrieves recent measurements for specified time series identifiers.
        This function fetches the most recent measurements for the given time series
        identifiers from the cache service. It's designed to provide quick access
        to the latest data points for multiple time series.
      operationId: recentByTimeSeriesIdentifier
      parameters:
      - name: identifiers
        in: query
        description: A list of time series identifiers for which to retrieve recent
          measurements. The list is limited to a maximum of 10 identifiers per request.
        required: true
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: recentByTimeSeriesIdentifier 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MrcTimeSeriesData"
components:
  schemas:
    ActualAndForecastedWaterLevel:
      required:
      - day
      - ltaValue
      - stationName
      type: object
      properties:
        stationName:
          type: string
        day:
          type: string
          format: date
        actualValue:
          type: number
          nullable: true
        forecastValue:
          type: number
          nullable: true
        ltaValue:
          type: number
    AdministrativeLevel:
      type: string
      enum:
      - COUNTRY
      - PROVINCE
    CountryCode:
      type: string
      enum:
      - LA
      - KH
      - TH
      - VN
      - CN
    DataItemCsvRowData:
      required:
      - areaCode
      - areaName
      - dataValueUnits
      - time
      type: object
      properties:
        time:
          type: integer
          format: int32
        areaCode:
          type: string
        areaName:
          type: string
        dataValueUnits:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DataValueUnit"
    DataItemDatasetMetadata:
      required:
      - data
      - metadata
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/DatasetMetadata"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataItemCsvRowData"
    DataPoint:
      required:
      - timestamp
      - value
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
        display:
          type: string
          nullable: true
    DataStoreType:
      type: string
      enum:
      - MONITORING_PARAMETER
      - DATA_ITEM
    DataValueUnit:
      type: object
      properties:
        value:
          type: number
          nullable: true
        unit:
          type: string
          nullable: true
    DatasetMetadata:
      required:
      - created
