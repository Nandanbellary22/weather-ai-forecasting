  /api/v1/time-series/corrected-data:
    get:
      tags:
      - Time-series
      summary: Retrieve Corrected Time-Series Data
      description: Fetches the corrected time-series data based on provided unique
        IDs or human-readable identifiers. The response is cached for a duration of
        24 hours.
      operationId: fetchCorrectedTimeSeriesData
      parameters:
      - name: uniqueId
        in: query
        description: "A list of unique IDs corresponding to one or more time-series.\
          \ Either `uniqueId` or `identifier` must be specified. Example: `7bb70347dbda404b9b521c9653f4be06`.\
          \ The maximum number of unique IDs is 10. Usage of `uniqueId` and `identifier`\
          \ is mutually exclusive."
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: identifier
        in: query
        description: "A list of human-readable identifiers for one or more time-series.\
          \ Either `uniqueId` or `identifier` must be specified. Example: `Water Level.Telemetry@LA_013901_[Pakse]`.\
          \ The maximum number of identifiers is 10. Usage of `uniqueId` and `identifier`\
          \ is mutually exclusive."
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: queryFrom
        in: query
        description: "The start date and time for the query in ISO 8601 format. This\
          \ is optional and defaults to the beginning of the record. Example: `2018-12-12T13:30:30`."
        schema:
          type: string
          format: date-time
          nullable: true
      - name: queryTo
        in: query
        description: "The end date and time for the query in ISO 8601 format. This\
          \ is optional and defaults to the end of the record. Example: `2021-12-12T23:59:59`."
        schema:
          type: string
          format: date-time
          nullable: true
      responses:
        "401":
          description: Authentication error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/MrcApiProblem"
        "403":
          description: Authorization error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/MrcApiProblem"
        "400":
          description: Invalid arguments
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/MrcApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/MrcApiProblem"
        "200":
          description: fetchCorrectedTimeSeriesData 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MrcTimeSeriesData"
