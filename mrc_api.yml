openapi: 3.0.1
info:
  title: MRC Information System API
  description: "\n<p>Welcome to the API documentation for the MRC Information System.\
    \ The MRC Information System API serves as a centralised gateway to the entire\
    \ corpus of data stored in the master database of the MRC Information System.</p>\n\
    <h4>Architecture</h4>\n<p>Internally, the MRC Information System is comprised\
    \ of multiple separate databases. This API provides unified access to these disparate\
    \ databases, offering an integrated view and management of the MRC's extensive\
    \ data assets.</p>\n<h4>Access and Permissions</h4>\n<p>Security is of paramount\
    \ importance to us. Access to the data is strictly permissions-based, employing\
    \ a group-based access control system. Each database has its own designated access\
    \ group.</p>\n<h4>MRC Data Portal</h4>\n<p>For further information, visit the\
    \ <a href='https://portal.mrcmekong.org/'>MRC Data Portal</a>.</p>\n        "
  contact:
    name: MRC Data team
    url: https://portal.mrcmekong.org
    email: mrcdata@mrcmekong.org
  license:
    name: Mekong River Commission Data Use Licence
    url: https://portal.mrcmekong.org/about/account-types
  version: "1.0"
security:
- Api-Key: []
paths:
  /api/v1/document/doms-documents:
    get:
      tags:
      - Document
      summary: Lists all DoMS documents
      description: The response is cached for 24 hours.
      operationId: domsDocuments
      responses:
        "200":
          description: domsDocuments 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /api/v1/document/download/{uniqueId}:
    get:
      tags:
      - Document
      summary: 'Downloads a '
      description: "EXPERIMENTAL: Implementation can change"
      operationId: download
      parameters:
      - name: uniqueId
        in: path
        description: "UniqueId of file to download. Must be present (example: `01LPDEHVFRQMF4ZCF2O5FLJ66V7QDO3SV2`)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: download 200 response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/document/generate-doi:
